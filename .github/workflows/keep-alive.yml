name: Keep Render Service Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Service
        run: |
          curl -sS -L --max-time 30 \
            "${{ vars.RENDER_SERVICE_URL }}" \
            -o /dev/null