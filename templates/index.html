<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141317">
  <title>Meetup Planner · IITM BS</title>
  <link rel="icon" href="/static/img/iitm_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css?v={{ v }}">
  <script>
    // Apply saved appearance before first paint (theme, accent, typeface) to avoid a flash.
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('prefs') || '{}'); } catch (e) {}
      var mode = p.mode || 'dark';
      if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      var d = document.documentElement;
      d.dataset.theme = mode;
      d.dataset.accent = p.accent || 'terracotta';
      d.dataset.font = p.font || 'jakarta';
      var fam = { jakarta: 'Plus+Jakarta+Sans:wght@400;500;600;700', inter: 'Inter:wght@400;500;600;700', geist: 'Geist:wght@400;500;600;700' }[d.dataset.font] || 'Plus+Jakarta+Sans:wght@400;500;600;700';
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.id = 'fontLink';
      l.href = 'https://fonts.googleapis.com/css2?family=' + fam + '&family=JetBrains+Mono:wght@400;500&display=swap';
      document.head.appendChild(l);
      document.querySelector('meta[name="theme-color"]').content = { light: '#F3F0E9', dark: '#141317', black: '#000000' }[mode];
    })();
  </script>
</head>
<body>

  <!-- Sign-in (shown when there is no session) -->
  <div id="signin" class="signin" hidden></div>

  <!-- App shell -->
  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="side-head">
        <a class="brand" href="#/home">
          <img src="/static/img/iitm_logo.png" alt="" width="28" height="28">
          <span class="brand-text">
            <strong>Meetup Planner</strong>
            <small>IIT Madras BS Degree</small>
          </span>
        </a>
        <button class="icon-btn side-toggle" data-action="collapse" type="button" aria-label="Collapse sidebar" data-tip="Collapse  [">
          <svg class="i i-sm"><use href="#i-sidebar"/></svg>
        </button>
      </div>
      <button class="nav-search" type="button" data-action="palette" data-tip="Search  ⌘K">
        <svg class="i i-sm"><use href="#i-search"/></svg><span>Search</span><kbd>⌘K</kbd>
      </button>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <a class="nav-link" data-nav="settings" href="#/settings" data-tip="Settings">
          <svg class="i"><use href="#i-settings"/></svg><span class="nav-label">Settings</span>
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="topbar-brand only-mobile" href="#/home">
          <img src="/static/img/iitm_logo.png" alt="" width="26" height="26">
          <span>Meetup Planner</span>
        </a>
        <div class="topbar-title hide-mobile" id="topbarTitle"></div>
        <div class="topbar-actions">
          <a class="btn btn-primary btn-sm hide-mobile" id="newProposalBtn" href="#/new" hidden>
            <svg class="i"><use href="#i-plus"/></svg> New proposal
          </a>
          <a class="icon-btn only-mobile" id="newProposalIcon" href="#/new" aria-label="New proposal" hidden>
            <svg class="i"><use href="#i-plus"/></svg>
          </a>
          <button class="icon-btn only-mobile" data-action="palette" type="button" aria-label="Search">
            <svg class="i"><use href="#i-search"/></svg>
          </button>
          <button class="icon-btn" data-action="notifications" type="button" aria-label="Notifications">
            <svg class="i"><use href="#i-bell"/></svg>
            <span class="dot-badge" id="notifBadge" hidden></span>
          </button>
          <button class="account-chip" data-action="account" type="button" aria-label="Account">
            <span id="topbarAvatar"></span>
            <span class="account-chip-text hide-tablet">
              <strong id="topbarName"></strong>
              <small id="topbarRole"></small>
            </span>
            <svg class="i i-sm hide-tablet"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav id="tabbar" class="tabbar" aria-label="Quick navigation"></nav>
  </div>

  <!-- Overlays -->
  <div id="popover" class="popover" hidden></div>
  <div id="palette" class="palette" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js?v={{ v }}"></script>
</body>
</html>
